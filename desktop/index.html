<!DOCTYPE html>
<html lang="ru" data-theme="hearth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e4336" />
    <title>test v1.0</title>
    <script>
      window.__VL_DESKTOP__ = true;
      (function () {
        try {
          var raw = localStorage.getItem("ochag-prefs-v1");
          var t = "hearth";
          var d = "comfortable";
          var m = "system";
          var s = "normal";
          if (raw) {
            var p = JSON.parse(raw);
            var st = p.state || p;
            if (st.theme) t = st.theme;
            if (st.density) d = st.density;
            if (st.motion) m = st.motion;
            if (st.typeScale) s = st.typeScale;
          }
          var el = document.documentElement;
          el.setAttribute("data-theme", t);
          el.setAttribute("data-density", d);
          el.setAttribute("data-motion", m);
          el.setAttribute("data-type", s);
          var dark = ["night", "ember", "slate"].indexOf(t) >= 0;
          el.classList.toggle("dark", dark);
          el.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "hearth");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-dvh bg-bg text-fg">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
