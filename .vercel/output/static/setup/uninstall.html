<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Удаление test v1.0 · Victimok Labs</title>
  <link rel="icon" href="media/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090b; --panel: #0c1014; --line: rgba(126,232,211,.16);
      --ink: #e8f4f1; --muted: #8aa39c; --dim: #5d736e; --accent: #7ee8d3; --danger: #e07a72;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; min-height: 100dvh; color: var(--ink); font-family: var(--font);
      background: radial-gradient(800px 380px at 50% 120%, rgba(126,232,211,.07), transparent 60%), #07090b;
    }
    .win {
      width: min(560px, calc(100vw - 24px));
      background: var(--panel); border: 1px solid var(--line);
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .bar {
      display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px;
      border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    }
    .bar img { width: 18px; height: 18px; }
    .bar span { color: var(--dim); letter-spacing: .18em; margin-left: 6px; }
    .pane { padding: 28px 28px 22px; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 500; letter-spacing: -.03em; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 20px; }
    button { height: 42px; padding: 0 16px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 13px; cursor: pointer; }
    .primary { background: var(--accent); color: #06201c; border-color: var(--accent); font-weight: 600; }
    .danger { background: var(--danger); color: #1a0808; border-color: var(--danger); font-weight: 600; }
    .credit { padding: 0 28px 18px; font-size: 11px; color: var(--dim); }
    .log { font-family: var(--mono); font-size: 12px; color: var(--accent); min-height: 1.6em; }
  </style>
</head>
<body>
  <div class="win" role="dialog" aria-label="Удаление test v1.0">
    <header class="bar">
      <img src="media/icon-192.png" alt="" />
      test v1.0
      <span>Uninstall · Victimok Labs</span>
    </header>
    <div class="pane" id="pane">
      <h1>Удалить test v1.0?</h1>
      <p>Программа, ярлыки и запись в «Программы и компоненты» будут сняты. Операционные данные в профиле пользователя можно оставить.</p>
      <p class="log" id="log"></p>
    </div>
    <div class="foot">
      <button type="button" id="cancel">Отмена</button>
      <button class="danger" type="button" id="go">Удалить</button>
    </div>
    <div class="credit">Разработано в Victimok Labs. Все права защищены © 2026</div>
  </div>
  <script>
    const go = document.getElementById("go");
    const cancel = document.getElementById("cancel");
    const log = document.getElementById("log");
    cancel.onclick = () => { try { window.close(); } catch {} };
    go.onclick = async () => {
      go.disabled = true; cancel.disabled = true;
      log.textContent = "Снимаем регистрацию Victimok Labs…";
      try {
        const r = await fetch("/api/uninstall", { method: "POST" });
        if (!r.ok) throw new Error("Не удалось удалить");
        log.textContent = "test v1.0 удалён. Разработано в Victimok Labs. Все права защищены.";
        setTimeout(() => { try { window.close(); } catch {} }, 900);
      } catch (e) {
        log.textContent = e.message || String(e);
        go.disabled = false; cancel.disabled = false;
      }
    };
  </script>
</body>
</html>
