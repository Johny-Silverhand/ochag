<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>test v1.0 — Setup · Victimok Labs</title>
  <link rel="icon" href="media/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090b;
      --panel: #0c1014;
      --raised: #12181e;
      --line: rgba(126, 232, 211, 0.16);
      --line-strong: rgba(126, 232, 211, 0.38);
      --ink: #e8f4f1;
      --muted: #8aa39c;
      --dim: #5d736e;
      --accent: #7ee8d3;
      --accent-dim: #1b3d38;
      --copper: #b08968;
      --danger: #e07a72;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    button, input { font-family: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.42; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: var(--font);
      background:
        radial-gradient(900px 420px at 70% 110%, rgba(126,232,211,0.07), transparent 55%),
        linear-gradient(180deg, #05070a 0%, #07090b 42%, #0a1014 100%);
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(126,232,211,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(126,232,211,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, black 38%, transparent 78%);
    }
    body::after {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: 0.18;
      background: repeating-linear-gradient(transparent 0 2px, rgba(255,255,255,0.03) 2px 3px);
    }
    .win {
      position: relative; z-index: 1;
      width: min(1080px, calc(100vw - 24px));
      height: min(720px, calc(100dvh - 24px));
      display: grid;
      grid-template-rows: 46px 1fr 70px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.55),
        0 40px 90px rgba(0,0,0,0.58),
        0 0 48px rgba(126,232,211,0.05);
      overflow: hidden;
    }
    .tick { position: absolute; width: 12px; height: 12px; z-index: 4; pointer-events: none; border-color: var(--accent); border-style: solid; opacity: 0.75; }
    .tick-tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
    .tick-tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
    .tick-bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
    .tick-br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
    .titlebar {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(126,232,211,0.06), transparent 46%), #090d11;
      user-select: none;
    }
    .titlebar img { width: 18px; height: 18px; }
    .titlebar .name { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }
    .titlebar .sub { color: var(--dim); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; margin-left: 2px; }
    .traffic { margin-left: auto; display: flex; gap: 7px; }
    .traffic i { width: 9px; height: 9px; border-radius: 99px; border: 1px solid var(--line-strong); display: block; }
    .traffic i:nth-child(1) { background: #3a2222; }
    .traffic i:nth-child(2) { background: #2c2a1e; }
    .traffic i:nth-child(3) { background: #16302c; }
    .body { display: grid; grid-template-columns: 248px 1fr; min-height: 0; }
    .rail {
      position: relative; overflow: hidden;
      border-right: 1px solid var(--line);
      padding: 26px 20px;
      display: flex; flex-direction: column;
    }
    .rail .photo {
      position: absolute; inset: 0;
      background: url("media/rail.jpg") center/cover;
      filter: saturate(0.7) brightness(0.42);
    }
    .rail .photo::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,9,11,0.35) 0%, rgba(7,9,11,0.92) 72%);
    }
    .rail .inner { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
    .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; color: var(--accent); text-transform: uppercase; }
    .brand { margin: 10px 0 26px; font-size: 24px; font-weight: 500; letter-spacing: -0.04em; }
    .steps { display: flex; flex-direction: column; gap: 2px; }
    .step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 7px 0; color: var(--dim); font-size: 13px; }
    .step .n { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; }
    .step.is-done { color: var(--muted); }
    .step.is-on { color: var(--ink); }
    .step.is-on .n { color: var(--accent); }
    .labs { margin-top: auto; padding-top: 16px; font-size: 10px; line-height: 1.55; color: var(--muted); }
    .pane { min-width: 0; min-height: 0; overflow: auto; padding: 32px 38px 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 500; letter-spacing: -0.035em; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.55; max-width: 54ch; }
    .hero { position: relative; height: 168px; margin-bottom: 22px; overflow: hidden; border: 1px solid var(--line); }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.78) brightness(0.78); }
    .hero span {
      position: absolute; left: 14px; bottom: 12px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
    }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .meta div { padding: 12px 14px; background: var(--raised); border: 1px solid var(--line); }
    .meta small { display: block; color: var(--dim); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
    .meta b { display: block; margin-top: 6px; font-size: 13px; font-weight: 500; }
    .license {
      height: 248px; overflow: auto; padding: 14px 16px;
      background: #070a0d; border: 1px solid var(--line);
      font-size: 12.5px; line-height: 1.65; color: var(--muted); white-space: pre-wrap;
    }
    .path { display: flex; gap: 8px; margin: 8px 0 16px; }
    .path input {
      flex: 1; height: 42px; padding: 0 12px;
      background: var(--raised); color: var(--ink);
      border: 1px solid var(--line); outline: none;
    }
    .path input:focus { border-color: var(--line-strong); }
    .ghost, .primary, .path button {
      height: 42px; padding: 0 16px; border: 1px solid var(--line);
      background: transparent; color: var(--ink); font-size: 13px; letter-spacing: 0.04em;
    }
    .primary { background: var(--accent); color: #06201c; border-color: var(--accent); font-weight: 600; }
    .primary:hover { filter: brightness(1.05); }
    .ghost:hover, .path button:hover { border-color: var(--line-strong); background: var(--raised); }
    .checks { display: grid; gap: 8px; }
    .check {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 11px 12px; background: var(--raised); border: 1px solid transparent;
    }
    .check input { margin-top: 3px; accent-color: var(--accent); }
    .check b { display: block; font-size: 13px; font-weight: 500; line-height: 1.35; }
    .check i { display: block; font-style: normal; color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.4; }
    .progress { height: 3px; background: var(--accent-dim); margin: 16px 0 12px; overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 180ms linear; }
    .log {
      height: 228px; overflow: auto; padding: 12px 14px;
      background: #070a0d; border: 1px solid var(--line);
      font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--muted);
    }
    .log .ok { color: var(--accent); }
    .foot {
      display: flex; align-items: center; gap: 16px;
      padding: 0 22px; border-top: 1px solid var(--line); background: #090d11;
    }
    .credit { font-size: 11px; color: var(--dim); line-height: 1.45; }
    .credit strong { color: var(--muted); font-weight: 500; }
    .actions { margin-left: auto; display: flex; gap: 8px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 10px; }
    .done-mark {
      width: 44px; height: 44px; display: grid; place-items: center;
      border: 1px solid var(--accent); color: var(--accent); margin-bottom: 16px;
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
    }
    a { color: var(--accent); }
    @media (max-width: 820px) {
      .win { width: 100vw; height: 100dvh; }
      .body { grid-template-columns: 1fr; }
      .rail { display: none; }
      .pane { padding: 22px 18px; }
      .credit { display: none; }
    }
  </style>
</head>
<body>
  <div class="win" role="dialog" aria-label="Установщик test v1.0">
    <span class="tick tick-tl"></span><span class="tick tick-tr"></span>
    <span class="tick tick-bl"></span><span class="tick tick-br"></span>
    <header class="titlebar">
      <img src="media/icon-192.png" alt="" />
      <span class="name">test v1.0</span>
      <span class="sub">Setup · Victimok Labs</span>
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>
    <div class="body">
      <aside class="rail">
        <div class="photo"></div>
        <div class="inner">
          <div class="kicker">Victimok Labs</div>
          <div class="brand">test v1.0</div>
          <nav class="steps" id="steps"></nav>
          <div class="labs">Разработано в Victimok Labs<br />Все права защищены © 2026</div>
        </div>
      </aside>
      <section class="pane" id="pane"></section>
    </div>
    <footer class="foot">
      <div class="credit">
        <strong>Разработано в Victimok Labs.</strong><br />Все права защищены. Не для перепродажи без лицензии.
      </div>
      <div class="actions">
        <button class="ghost" type="button" id="back">Назад</button>
        <button class="primary" type="button" id="next">Далее</button>
      </div>
    </footer>
  </div>
  <script>
    const STEPS = [
      { id: "welcome", label: "Приветствие" },
      { id: "license", label: "Лицензия" },
      { id: "path", label: "Расположение" },
      { id: "options", label: "Компоненты" },
      { id: "install", label: "Установка" },
      { id: "done", label: "Готово" },
    ];
    const LICENSE = `ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ
test v1.0 · Victimok Labs

© 2026 Victimok Labs. Все права защищены.

Настоящее программное обеспечение, включая исполняемые модули, интерфейс, документацию и обозначения «test v1.0», «Очаг» и «Victimok Labs», охраняется законодательством об авторском праве.

1. Вам предоставляется неисключительное право установки и использования одной рабочей копии в пределах приобретённой лицензии.
2. Запрещаются копирование дистрибутива для перепродажи, декомпиляция, обход ограничений и передача третьим лицам без письменного согласия Victimok Labs.
3. Операционные данные сети обрабатываются локально и в подключённой базе. Издатель не отвечает за утрату из-за вмешательства в файлы установки.
4. Устанавливая программу, вы подтверждаете согласие с условиями и с тем, что «Разработано в Victimok Labs. Все права защищены.»

Контакты правообладателя: Victimok Labs, 2026.`;

    const state = {
      i: 0, native: false, accepted: false,
      dir: "C\\\\Program Files\\\\Victimok Labs\\\\test v1.0",
      desktop: true, startMenu: true, autostart: false, busy: false,
    };

    const pane = document.getElementById("pane");
    const stepsEl = document.getElementById("steps");
    const back = document.getElementById("back");
    const next = document.getElementById("next");

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = String(s);
      return d.innerHTML;
    }

    function renderSteps() {
      stepsEl.innerHTML = STEPS.map((s, idx) => {
        const cls = idx === state.i ? "is-on" : idx < state.i ? "is-done" : "";
        return `<div class="step ${cls}"><span class="n">${String(idx + 1).padStart(2, "0")}</span><span>${s.label}</span></div>`;
      }).join("");
    }

    function view() {
      const id = STEPS[state.i].id;
      next.disabled = false;
      if (id === "welcome") {
        pane.innerHTML = `
          <div class="hero"><img src="media/hero.jpg" alt="" /><span>Victimok Labs · runtime 1.0</span></div>
          <h1>Установка test v1.0</h1>
          <p class="lead">Операционный контур смены, склада, кассы и банкетов. Ставится как обычная программа Windows — ярлыки, удаление, подпись издателя.</p>
          <div class="meta">
            <div><small>Издатель</small><b>Victimok Labs</b></div>
            <div><small>Версия</small><b>1.0 · build 2026.09.03</b></div>
          </div>
          <p class="lead" id="welcome-dl" style="margin-top:18px"></p>`;
        if (!state.native) {
          document.getElementById("welcome-dl").innerHTML =
            `Файл установщика: <a href="/downloads/test-v1.0-Setup.exe" download>test v1.0 Setup.exe</a>`;
        }
        next.textContent = "Далее";
      }
      if (id === "license") {
        pane.innerHTML = `
          <h1>Лицензия</h1>
          <p class="lead">Без согласия установка не продолжится.</p>
          <div class="license">${esc(LICENSE)}</div>
          <label class="check" style="margin-top:12px">
            <input type="checkbox" id="acc" ${state.accepted ? "checked" : ""} />
            <span><b>Принимаю условия Victimok Labs</b><i>Разработано в Victimok Labs. Все права защищены.</i></span>
          </label>`;
        document.getElementById("acc").onchange = (e) => {
          state.accepted = e.target.checked;
          next.disabled = !state.accepted;
        };
        next.disabled = !state.accepted;
        next.textContent = "Принять";
      }
      if (id === "path") {
        pane.innerHTML = `
          <h1>Папка установки</h1>
          <p class="lead">Контур ставится как обычная Windows-программа. Путь можно сменить.</p>
          <div class="path">
            <input id="dir" value="${esc(state.dir)}" />
            <button type="button" class="ghost" id="browse">Обзор</button>
          </div>
          <div class="meta">
            <div><small>Требуется</small><b>~ 90 МБ на диске</b></div>
            <div><small>Права</small><b>текущий пользователь</b></div>
          </div>`;
        document.getElementById("dir").oninput = (e) => { state.dir = e.target.value; };
        document.getElementById("browse").onclick = async () => {
          if (!state.native) return;
          const r = await fetch("/api/browse", { method: "POST" });
          if (r.ok) {
            const j = await r.json();
            if (j.dir) { state.dir = j.dir; document.getElementById("dir").value = j.dir; }
          }
        };
        next.textContent = "Далее";
      }
      if (id === "options") {
        pane.innerHTML = `
          <h1>Компоненты</h1>
          <p class="lead">Ярлыки и автозагрузка. Ядро ставится всегда.</p>
          <div class="checks">
            <label class="check"><input type="checkbox" checked disabled /><span><b>Ядро test v1.0</b><i>Исполняемый модуль, локальный контур, подпись Victimok Labs</i></span></label>
            <label class="check"><input type="checkbox" id="sm" ${state.startMenu ? "checked" : ""} /><span><b>Меню «Пуск»</b><i>Victimok Labs → test v1.0</i></span></label>
            <label class="check"><input type="checkbox" id="dt" ${state.desktop ? "checked" : ""} /><span><b>Ярлык на рабочем столе</b><i>Запуск без поиска в меню</i></span></label>
            <label class="check"><input type="checkbox" id="au" ${state.autostart ? "checked" : ""} /><span><b>Автозапуск со Windows</b><i>По желанию, можно выключить позже</i></span></label>
          </div>`;
        document.getElementById("sm").onchange = (e) => state.startMenu = e.target.checked;
        document.getElementById("dt").onchange = (e) => state.desktop = e.target.checked;
        document.getElementById("au").onchange = (e) => state.autostart = e.target.checked;
        next.textContent = "Установить";
      }
      if (id === "install") {
        pane.innerHTML = `
          <h1>Идёт установка</h1>
          <p class="lead" id="inst-lead">Копируем модули Victimok Labs и регистрируем программу в Windows.</p>
          <div class="progress"><i id="bar"></i></div>
          <div class="log" id="log"></div>
          <p class="err" id="ierr" hidden></p>`;
        next.disabled = true;
        back.disabled = true;
        next.textContent = "Далее";
        void runInstall();
      }
      if (id === "done") {
        pane.innerHTML = `
          <div class="hero"><img src="media/done.jpg" alt="" /><span>Установка завершена</span></div>
          <div class="done-mark">OK</div>
          <h1>test v1.0 установлен</h1>
          <p class="lead">Разработано в Victimok Labs. Все права защищены. Смена, склад и касса уже внутри.</p>
          <div class="checks">
            <label class="check"><input type="checkbox" id="launch" checked /><span><b>Запустить test v1.0</b><i>Открыть операционный контур сразу после выхода</i></span></label>
          </div>
          <p class="lead" style="margin-top:18px" id="dl-line"></p>`;
        if (!state.native) {
          document.getElementById("dl-line").innerHTML =
            `Нужен файл для Windows: <a href="/downloads/test-v1.0-Setup.exe" download>test v1.0 Setup.exe</a>`;
        }
        next.disabled = false;
        back.disabled = true;
        next.textContent = "Готово";
      }
      back.disabled = state.i === 0 || id === "install" || id === "done";
      renderSteps();
    }

    const LINES = [
      "Проверка целостности пакета…",
      "Распаковка ядра test v1.0.exe",
      "Запись app.ico и подписи издателя",
      "Размещение контура и локального хранилища",
      "Регистрация в «Программы и компоненты»",
      "Ярлык Victimok Labs в меню Пуск",
      "Ярлык на рабочем столе",
      "Контрольная сумма… OK",
      "Разработано в Victimok Labs. Все права защищены.",
    ];

    async function runInstall() {
      const log = document.getElementById("log");
      const bar = document.getElementById("bar");
      const err = document.getElementById("ierr");
      const write = (t, ok) => {
        const d = document.createElement("div");
        d.textContent = "› " + t;
        if (ok) d.className = "ok";
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
      };
      try {
        if (state.native) {
          write("Связь с установщиком…");
          const r = await fetch("/api/install", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              dir: state.dir, desktop: state.desktop,
              startMenu: state.startMenu, autostart: state.autostart,
            }),
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || "Ошибка установки");
        }
        for (let i = 0; i < LINES.length; i++) {
          await wait(state.native ? 90 : 150);
          bar.style.width = ((i + 1) / LINES.length * 100) + "%";
          write(LINES[i], i === LINES.length - 1);
        }
        await wait(220);
        state.i += 1;
        view();
      } catch (e) {
        err.hidden = false;
        err.textContent = e.message || String(e);
        back.disabled = false;
        next.disabled = false;
        next.textContent = "Повторить";
      }
    }

    function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

    back.onclick = () => { if (state.i > 0) { state.i -= 1; view(); } };
    next.onclick = async () => {
      const id = STEPS[state.i].id;
      if (id === "license" && !state.accepted) return;
      if (id === "install") { view(); return; }
      if (id === "done") {
        const launch = document.getElementById("launch")?.checked !== false;
        if (state.native) {
          await fetch("/api/finish", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ launch }) });
          try { window.close(); } catch {}
        } else if (launch) {
          (window.top || window).location.href = "/";
        }
        return;
      }
      if (state.i < STEPS.length - 1) { state.i += 1; view(); }
    };

    (async () => {
      view();
      try {
        const r = await fetch("/api/meta", { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          if (j.native) {
            state.native = true;
            if (j.defaultDir) state.dir = j.defaultDir;
            view();
          }
        }
      } catch {}
    })();
  </script>
</body>
</html>
